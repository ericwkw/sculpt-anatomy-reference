<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons.svg" />
  <title>Sculpt Anatomy Ref</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="topbar">
    <select id="model-select"></select>
    <button id="snap-btn" title="Save reference snapshot">📷</button>
    <button id="gallery-btn" title="Open gallery">🖼</button>
    <button id="render-mode-btn" class="mode-btn" title="Cycle: skin, clay, or planar clay study">Clay</button>
    <button id="credits-btn" title="Model credits">ⓘ</button>
  </header>

  <model-viewer
    id="viewer"
    src=""
    camera-controls
    touch-action="none"
    interaction-prompt="none"
    shadow-intensity="0.85"
    shadow-softness="0.6"
    exposure="1.05"
    tone-mapping="neutral"
    ar
    ar-modes="quick-look webxr scene-viewer"
  >
    <div id="no-model" class="overlay-msg" hidden></div>
  </model-viewer>

  <div id="part-bar" class="part-bar" hidden></div>
  <div id="layer-bar" class="layer-bar"></div>

  <dialog id="gallery-dialog">
    <div class="gallery-header">
      <h2>Saved References</h2>
      <button id="gallery-close">✕</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </dialog>

  <dialog id="credits-dialog">
    <div class="gallery-header">
      <h2>Model Credits</h2>
      <button id="credits-close">✕</button>
    </div>
    <div id="credits-body" class="credits-body"></div>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
